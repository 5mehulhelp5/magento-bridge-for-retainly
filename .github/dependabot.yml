version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      php-dependencies: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
