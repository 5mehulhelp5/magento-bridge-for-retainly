name: Feature
description: Something new, or a change to how something works
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today? Describe the problem, not the solution.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: How we know it is done
      description: Observable acceptance criteria.
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [observers, cron, outbox, api, pixel, config, docs, infra]
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
    validations: {required: true}
